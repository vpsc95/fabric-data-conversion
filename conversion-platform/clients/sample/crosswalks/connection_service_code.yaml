open_questions:
- id: OQ-CONN-SENIOR-DISCOUNT
  text: Should service codes 105 and 205 be excluded? The script has the exclusion
    commented out.
  owner: cogsdale
  status: assumed
  assumption: Service codes 105 and 205 (senior discounts) are not converted as services.
    They fail 'Invalid ServiceType' and are expected by design (DEMO-41065); the commented-out
    filter stays off.
  evidence: 'The 6,694 expected invalid-service-type failures reproduce exactly: 105:
    952, 205: 857, 300: 4,873, 400: 9, 600: 3. Filtering 105/205 out in staging would
    change received (20,037) and failed (7,119), which both match.'
  decided_by: Demo assumptions only; recipient review required
  decided_on: '2026-10-06'
- id: OQ-CONN-GRINDER-CATEGORY
