    to 99.
  owner: cogsdale
  status: assumed
  assumption: Grinder service (500) keeps category 99, as coded.
  evidence: 'Grinder connections never load: all 43 fail the tariff check by design
    (DEMO-41068), which reproduces exactly. The category rule fires on those same
    records only.'
  decided_by: Demo assumptions only; recipient review required
