kind: reshape
version: 1
client: sample
id: sample-um-customer
source:
  file: SAMPLE_UM_Customer
  layout: table
  read_as_text: true
steps:
- derive:
    LegacyAcctNo: INCODEACCT
    CustomerID: CustomerIDX + 100000
    LocationID: CustomerIDX + 500000
    SecCustIDX: SecCustIDX + 10000
    SIN: REPLACE(REPLACE(SOCIAL, '-', ''), ' ', '')
    Zip: REPLACE(ZIP, '-', '')
    New_Existing: CUSTOMERSTATUS
- derive:
    Phone1: normalized PHONENUMBER before first space or comma
    Phone2: normalized HOMENUMBER before first space or comma
    Phone3: normalized CELLNUMBER before first space or comma
    AlternateID: CONCAT(DRIVERSLICENSE, ' ', DLST)
- dedupe:
    keys:
    - CustomerID
    keep: first
    order_by:
    - CustomerIDX
target: silver.sample_um_customer
