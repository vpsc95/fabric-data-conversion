- id: OQ-LOCHIST-1
  owner: cogsdale
  text: How was the location history (UM00600H, 568 records) built at go-live? The
    staging scripts don't include this step.
  status: assumed
  assumption: One move-in history record per legacy account that has a beginning balance
    or deposit at a known location where it isn't the current bill-to (gold.usp_Build_LocationHistory).
  evidence: This rule produces exactly 568 records, and with them the balance (6)
    and deposit (19) customer|location failures reproduce.
  decided_by: Demo assumptions only; recipient review required
  decided_on: '2026-10-06'
