  code the mapping specs produce is assumed to exist in CSM, except where the go-live
  integrity report shows otherwise. Replace with the CSM setup snapshot (UM41000,
  UM41301, UM40900, UM40630, UM40600, UM40700, UM41930, TX00101) when reviewer provides
