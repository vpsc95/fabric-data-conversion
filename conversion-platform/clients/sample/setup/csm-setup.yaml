open_questions:
- id: OQ-SETUP-SNAPSHOT
  text: Provide the CSM setup snapshot for the go-live company (service types, tariffs,
    routes, connection statuses, equipment classes, misc charge types, deposit types,
    tax schedules) so the setup-dependent rules stop relying on provisional values.
  owner: cogsdale
  status: assumed
  assumption: Until a CSM setup snapshot exists, the CSM setup is the set of codes
    the specs produce, minus GRP (OQ-SETUP-GRP).
  evidence: 'Every setup-dependent count reproduces: invalid service type 6,694, invalid
    rate 64, invalid tariff 43, and no route, connection status, equipment class,
    misc charge or deposit type failures, as in the report.'
  decided_by: Demo assumptions only; recipient review required
  decided_on: '2026-10-06'
- id: OQ-SETUP-GRP
  text: Confirm the grinder fixed tariff GRP stays out of CSM (grinder service not
    converted at go-live, DEMO-41068).
  owner: cogsdale
  status: assumed
  assumption: The grinder fixed tariff GRP is not set up in CSM.
  evidence: The report's 43 grinder tariff failures (DEMO-41068) reproduce only when
    GRP is absent.
  decided_by: Demo assumptions only; recipient review required
  decided_on: '2026-10-06'
