name: Release validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: python .github/skills/gp-csm-sql-conventions/scripts/lint_tsql.py conversion-platform/sql
      - run: python .github/skills/conversion-spec/scripts/lint_spec.py conversion-platform/clients/sample --catalog conversion-platform/catalog/cogsdale-csm-gp/catalog.sample.json
